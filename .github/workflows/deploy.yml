name: Build and test
on:
  push:
    branches: 
      - master

jobs:
  build:
    runs-on: ubuntu-latest
     
    steps:
    - uses: actions/checkout@v2
    - run: docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}
    - run: docker build -t ziadyehia -f Dockerfile .
    -run: docker run -e CI=true ziadyehia npm run test